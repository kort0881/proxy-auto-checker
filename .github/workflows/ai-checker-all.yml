name: AI Checker ALL

on:
  schedule:
    - cron: '10 */6 * * *'
  workflow_dispatch:

jobs:
  ai-check-all:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install requests
        run: python -m pip install requests

      - name: Run AI Checker ALL
        env:
          PYTHONUNBUFFERED: 1
        run: python ai_checker_all.py
