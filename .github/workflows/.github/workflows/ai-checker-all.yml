name: AI Checker ALL

on:
  schedule:
    - cron: '5 */6 * * *'     # подстрой под свой конвейер
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ai-check-all:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run AI Checker ALL
        run: python ai_checker_all.py
        env:
          PYTHONUNBUFFERED: 1
