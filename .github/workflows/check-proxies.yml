name: Auto Proxy Checker

on:
  schedule:
    - cron: '0 */12 * * *'  # Каждые 12 часов (00:00 и 12:00 UTC)
  workflow_dispatch:  # Ручной запуск через Actions

jobs:
  check-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 240  # 🔥 4 часа (достаточно для 1677 ключей)
    
    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v3
    
    - name: 🐍 Setup Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: 📦 Install dependencies
      run: |
        pip install --upgrade pip
        pip install requests[socks] urllib3
    
    - name: 🔍 Run proxy checker
      run: |
        python check_proxies.py
      continue-on-error: false
    
    - name: 📤 Post to Telegram
      if: success()
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_BOT_TOKEN_PUBLIC: ${{ secrets.TELEGRAM_BOT_TOKEN_PUBLIC }}
        TELEGRAM_PRIVATE_CHANNEL: ${{ secrets.TELEGRAM_PRIVATE_CHANNEL }}
      run: |
        python post_to_telegram.py
    
    - name: 📁 Upload results as artifact
      if: always()  # 🔥 Загружать даже если скрипт упал
      uses: actions/upload-artifact@v4
      with:
        name: verified-keys-${{ github.run_number }}  # Уникальное имя
        path: |
          results/verified_*.txt
          results/semi_dead_*.txt
          results/checkpoint_*.txt
        retention-days: 7
        if-no-files-found: warn  # 🔥 НОВОЕ: Предупреждение вместо ошибки
    
    - name: 📊 Show summary
      if: always()
      run: |
        echo "## 📊 Результаты проверки" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ -f results/verified_*.txt ]; then
          PERFECT_COUNT=$(cat results/verified_*.txt | grep -v "^#" | wc -l)
          echo "🟢 **Идеальных ключей:** $PERFECT_COUNT" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [ -f results/semi_dead_*.txt ]; then
          PARTIAL_COUNT=$(cat results/semi_dead_*.txt | grep -v "^#" | wc -l)
          echo "🟠 **Полудохлых ключей:** $PARTIAL_COUNT" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ Workflow завершён" >> $GITHUB_STEP_SUMMARY



