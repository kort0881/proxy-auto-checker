name: Auto Proxy Checker

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

concurrency:
  group: proxy-checker-push
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 🐍 Setup Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 📦 Install dependencies
      run: |
        pip install --upgrade pip
        pip install requests[socks]

    - name: 🔍 Run proxy checker
      id: checker
      run: |
        python check_proxies.py 2>&1 | tee checker.log
        exit_code=${PIPESTATUS[0]}
        echo "exit_code=$exit_code" >> $GITHUB_OUTPUT
        
        # Проверяем наличие результатов
        if ls results/verified_*.txt 1> /dev/null 2>&1; then
          echo "has_results=true" >> $GITHUB_OUTPUT
          echo "✅ Results files found"
        else
          echo "has_results=false" >> $GITHUB_OUTPUT
          echo "⚠️ No result files found"
        fi
        
        exit 0

    - name: 💾 ALWAYS Save to repository
      run: |
        mkdir -p checked/latest
        latest_verified=$(ls -t results/verified_*.txt 2>/dev/null | head -1)
        
        if [ -f "$latest_verified" ]; then
          cp "$latest_verified" checked/latest/verified.txt
          key_count=$(grep -v "^#" checked/latest/verified.txt | grep -v "^$" | wc -l)
          echo "✅ Copied ${key_count} keys"
        else
          echo "# @vlesstrojan" > checked/latest/verified.txt
          echo "# $(date -u)" >> checked/latest/verified.txt
          echo "# No verified keys (checker exit: ${{ steps.checker.outputs.exit_code }})" >> checked/latest/verified.txt
          echo "ℹ️ Empty results file created"
        fi

    - name: 📤 Post to Telegram (if results)
      if: steps.checker.outputs.has_results == 'true'
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_BOT_TOKEN_PUBLIC: ${{ secrets.TELEGRAM_BOT_TOKEN_PUBLIC }}
        TELEGRAM_PRIVATE_CHANNEL: ${{ secrets.TELEGRAM_PRIVATE_CHANNEL }}
      run: python post_to_telegram.py || echo "⚠️ Telegram posting failed"

    - name: 📁 Upload ALL artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: proxy-results-${{ github.run_number }}
        path: |
          results/**
          checker.log
        retention-days: 7
        if-no-files-found: ignore

    - name: 🚀 Commit results
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git pull origin main --rebase || true
        git add checked/latest/
        
        if ! git diff --cached --quiet; then
          git commit -m "🔄 Proxy check: ${{ steps.checker.outputs.total_keys || '?' }} keys $(date -u +'%Y-%m-%d %H:%M')"
          git push origin main
        else
          echo "ℹ️ No changes to commit"
        fi
