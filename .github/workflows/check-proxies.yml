name: Auto Proxy Checker

on:
  schedule:
    - cron: '0 */12 * * *'  # Каждые 12 часов (00:00 и 12:00 UTC)
  workflow_dispatch:  # Ручной запуск через Actions

# ✅ ДОБАВЛЕНО: Запрет параллельных запусков
concurrency:
  group: proxy-checker-push  # Общая группа для обоих workflow
  cancel-in-progress: false  # Ждём завершения предыдущего

# ✅ ДОБАВЛЕНО: Permissions для git push
permissions:
  contents: write

jobs:
  check-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # 2 часа максимум
    
    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4  # ← ОБНОВЛЕНО до v4
      with:
        fetch-depth: 0  # ✅ ДОБАВЛЕНО: полная история для git pull
    
    - name: 🐍 Setup Python 3.11
      uses: actions/setup-python@v5  # ← ОБНОВЛЕНО до v5
      with:
        python-version: '3.11'
    
    - name: 📦 Install dependencies
      run: |
        pip install --upgrade pip
        pip install requests[socks]
    
    - name: 🔍 Run proxy checker
      run: |
        python check_proxies.py
      continue-on-error: false
    
    - name: 💾 Save to repository
      if: success()
      run: |
        mkdir -p checked/latest
        latest_verified=$(ls -t results/verified_*.txt 2>/dev/null | head -1)
        if [ -f "$latest_verified" ]; then
          cp "$latest_verified" checked/latest/verified.txt
          key_count=$(grep -v "^#" checked/latest/verified.txt | grep -v "^$" | wc -l)
          echo "✅ Copied: ${key_count} keys to checked/latest/verified.txt"
        else
          echo "⚠️ No verified files found"
        fi
    
    - name: 📤 Post to Telegram
      if: success()
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_BOT_TOKEN_PUBLIC: ${{ secrets.TELEGRAM_BOT_TOKEN_PUBLIC }}
        TELEGRAM_PRIVATE_CHANNEL: ${{ secrets.TELEGRAM_PRIVATE_CHANNEL }}
      run: |
        python post_to_telegram.py
    
    - name: 📁 Upload results as artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: verified-keys
        path: results/verified_*.txt
        retention-days: 7
    
    # ✅ ИСПРАВЛЕНО: добавлен git pull перед push
    - name: 🚀 Commit to repository
      if: success()
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        
        # Подтягиваем последние изменения из main
        git fetch origin main
        git pull origin main --rebase || echo "Nothing to pull"
        
        # Добавляем наши изменения
        git add checked/latest/
        
        # Коммитим (если есть изменения)
        git diff --cached --quiet || git commit -m "✨ Update verified keys: $(date -u +'%Y-%m-%d %H:%M UTC')"
        
        # Пушим
        git push origin main








