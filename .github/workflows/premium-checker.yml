name: Proxy Checker

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

concurrency:
  group: proxy-checker
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        fetch-depth: 1

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install deps
      run: |
        pip install --upgrade pip
        pip install requests[socks]

    - name: Run checker
      run: |
        python advanced_checker.py --workers 8 --tcp-workers 100 --min-cats 5

    - name: Post to Telegram
      if: success()
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_PRIVATE_CHANNEL: '-1002926041814'
      run: python post_to_telegram.py

    - name: Commit results
      if: success()
      run: |
        git config user.name "Proxy Bot"
        git config user.email "bot@github.actions"

        # ← ИЗМЕНЕНО: checked/latest/verified.txt вместо results/verified.txt
        git add -f checked/latest/verified.txt
        git add -f results/stats_latest.json

        if git diff --cached --quiet; then
          echo "No changes"
          exit 0
        fi

        TOTAL=$(python -c "import json; print(json.load(open('results/stats_latest.json'))['total_working'])")
        git commit -m "✨ Verified: ${TOTAL} keys [$(date -u +'%Y-%m-%d %H:%M UTC')]"

        for i in 1 2 3; do
          git push origin main && break
          git pull --rebase origin main
          sleep 5
        done

    - name: Upload artifact
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: verified-${{ github.run_number }}
        path: |
          checked/latest/verified.txt
          results/stats_latest.json
          results/checker.log
        retention-days: 3
