name: 🚀 AI Proxy Checker Pro

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      region:
        description: 'Регион для проверки'
        required: false
        default: 'ALL'
        type: choice
        options:
          - ALL
          - RU
          - EU

concurrency:
  group: proxy-checker-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.11'
  MIN_KEYS_THRESHOLD: 5

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: 🐍 Setup Python + Cache
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
        cache-dependency-path: 'requirements.txt'

    - name: 📦 Create requirements.txt
      run: |
        cat > requirements.txt << 'REQS'
        requests[socks]
        scikit-learn
        tqdm
        colorama
        REQS

    - name: 📦 Install Dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r requirements.txt

    - name: 🔥 Run AI Checker
      id: check
      run: |
        REGION="${{ github.event.inputs.region || 'ALL' }}"
        python advanced_checker.py --region "$REGION" --workers 16 --tcp-workers 50

        # Подсчёт результатов
        total=0
        elite=0
        premium=0

        if [ -f results/premium/elite.txt ]; then
          elite=$(grep -c "://" results/premium/elite.txt 2>/dev/null || echo "0")
        fi
        if [ -f results/premium/premium.txt ]; then
          premium=$(grep -c "://" results/premium/premium.txt 2>/dev/null || echo "0")
        fi

        for f in results/premium/*.txt; do
          if [ -f "$f" ]; then
            count=$(grep -c "://" "$f" 2>/dev/null || echo "0")
            total=$((total + count))
          fi
        done

        echo "total=$total" >> "$GITHUB_OUTPUT"
        echo "elite=$elite" >> "$GITHUB_OUTPUT"
        echo "premium=$premium" >> "$GITHUB_OUTPUT"

        echo "📊 Results: total=$total elite=$elite premium=$premium"

        if [ "$total" -lt "${{ env.MIN_KEYS_THRESHOLD }}" ]; then
          echo "::warning::Found only $total keys (minimum ${{ env.MIN_KEYS_THRESHOLD }})"
        fi

    - name: 📊 Generate Stats Report
      if: success()
      env:
        REPO_NAME: ${{ github.repository }}
        RUN_ID: ${{ github.run_id }}
        RUN_NUMBER: ${{ github.run_number }}
        TOTAL_KEYS: ${{ steps.check.outputs.total }}
        ELITE_KEYS: ${{ steps.check.outputs.elite }}
        PREMIUM_KEYS: ${{ steps.check.outputs.premium }}
      run: |
        python << 'PYSCRIPT'
        import json, os, time
        from pathlib import Path
        from datetime import datetime

        repo = os.environ.get("REPO_NAME", "user/repo")
        run_id = os.environ.get("RUN_ID", "0")
        run_number = os.environ.get("RUN_NUMBER", "0")
        total = os.environ.get("TOTAL_KEYS", "0")
        elite = os.environ.get("ELITE_KEYS", "0")
        premium = os.environ.get("PREMIUM_KEYS", "0")

        # Load stats from checker if exists
        stats_file = Path("results/stats_latest.json")
        stats_data = {}
        if stats_file.exists():
            with open(stats_file) as f:
                stats_data = json.load(f)

        by_protocol = stats_data.get("by_protocol", {})
        good = stats_data.get("by_quality", {}).get("good", 0)
        standard = stats_data.get("by_quality", {}).get("standard", 0)
        mutations_ok = stats_data.get("mutations", {}).get("successful", 0)
        ai_enabled = stats_data.get("ai", {}).get("enabled", False)
        proc_time = stats_data.get("processing_time", 0)

        now = datetime.utcnow().strftime("%Y-%m-%d %H:%M UTC")
        date_badge = datetime.utcnow().strftime("%Y--%m--%d")

        # Protocol lines
        proto_lines = ""
        for proto, count in sorted(by_protocol.items(), key=lambda x: x[1], reverse=True):
            pct = (int(count) / max(int(total), 1)) * 100
            proto_lines += f"- **{proto}**: {count} ({pct:.1f}%)\n"

        if not proto_lines:
            proto_lines = "- No data yet\n"

        readme = f"""# 🔥 AI Proxy Collection

![Total](https://img.shields.io/badge/Total-{total}-brightgreen)
![Elite](https://img.shields.io/badge/Elite-{elite}-gold)
![Premium](https://img.shields.io/badge/Premium-{premium}-blue)
![Updated](https://img.shields.io/badge/Updated-{date_badge}-orange)

## 📊 Statistics

| Quality  | Count    | File |
|----------|----------|------|
| Elite    | {elite}  | [elite.txt](results/premium/elite.txt) |
| Premium  | {premium}| [premium.txt](results/premium/premium.txt) |
| Good     | {good}   | [good.txt](results/premium/good.txt) |
| Standard | {standard}| [standard.txt](results/premium/standard.txt) |

## 🔧 Protocol Distribution

{proto_lines}

## 🚀 Features

- 🧠 **AI-Powered** quality prediction and anomaly detection
- 🧬 **Smart Mutations** - {mutations_ok} successful bypasses
- ✅ **Multi-layer validation** with reconnection tests
- 📈 **Latency optimization** with jitter analysis

## 📥 Usage

```bash
# Download elite proxies
curl -sL https://raw.githubusercontent.com/{repo}/main/results/premium/elite.txt

# Download all working keys
wget https://raw.githubusercontent.com/{repo}/main/results/premium/premium.txt


