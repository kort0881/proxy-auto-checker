name: Premium Proxy Checker

on:
  schedule:
    - cron: '0 6 * * *'  # Каждый день в 6:00 UTC
  workflow_dispatch:

# ✅ ДОБАВЛЕНО: та же concurrency группа
concurrency:
  group: proxy-checker-push  # Общая группа с check-proxies.yml
  cancel-in-progress: false

# ✅ ДОБАВЛЕНО: Permissions
permissions:
  contents: write

jobs:
  advanced-check:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    
    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4  # ← ОБНОВЛЕНО до v4
      with:
        fetch-depth: 0  # ✅ ДОБАВЛЕНО
    
    - name: 🐍 Setup Python
      uses: actions/setup-python@v5  # ← ОБНОВЛЕНО до v5
      with:
        python-version: '3.11'
    
    - name: 📦 Install
      run: |
        pip install --upgrade pip
        pip install requests[socks]
    
    - name: 📥 Download verified keys
      uses: dawidd6/action-download-artifact@v2
      with:
        workflow: check-proxies.yml
        name: verified-keys
        path: results/
      continue-on-error: true
    
    - name: 🔥 Run advanced check
      run: python advanced_checker.py
    
    - name: 📁 Upload premium artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: premium-keys
        path: results/premium/*.txt
        retention-days: 30
    
    # ✅ ИСПРАВЛЕНО: добавлен git pull перед push
    - name: 💾 Commit premium results to repository
      if: success()
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        
        # Подтягиваем последние изменения
        git fetch origin main
        git pull origin main --rebase || echo "Nothing to pull"
        
        # Добавляем всю папку results/premium
        git add results/premium/
        
        # Считаем ключи
        total_keys=$(find results/premium -name "*.txt" -exec grep -v "^#" {} \; | grep -v "^$" | wc -l)
        
        # Коммитим (если есть изменения)
        git diff --cached --quiet || git commit -m "✨ Update premium keys: ${total_keys} total [$(date -u +'%Y-%m-%d %H:%M UTC')]"
        
        # Пушим
        git push origin main
        
        echo "✅ Premium results saved to results/premium/"
        echo "📊 Files:"
        ls -lh results/premium/


