name: AI Proxy Checker

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      region:
        description: 'Region'
        required: false
        default: 'ALL'
        type: choice
        options:
          - ALL
          - RU
          - EU

concurrency:
  group: proxy-checker
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        pip install --upgrade pip
        pip install requests scikit-learn tqdm colorama

    - name: Run Checker
      id: check
      run: |
        REGION="${{ github.event.inputs.region || 'ALL' }}"
        python advanced_checker.py --region "$REGION" --workers 16 --tcp-workers 50
        total=0
        elite=0
        premium=0
        if [ -f results/premium/elite.txt ]; then
          elite=$(grep -c "://" results/premium/elite.txt || echo "0")
        fi
        if [ -f results/premium/premium.txt ]; then
          premium=$(grep -c "://" results/premium/premium.txt || echo "0")
        fi
        for f in results/premium/*.txt; do
          if [ -f "$f" ]; then
            count=$(grep -c "://" "$f" || echo "0")
            total=$((total + count))
          fi
        done
        echo "total=$total" >> "$GITHUB_OUTPUT"
        echo "elite=$elite" >> "$GITHUB_OUTPUT"
        echo "premium=$premium" >> "$GITHUB_OUTPUT"

    - name: Upload Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: keys-${{ github.run_number }}
        path: |
          results/premium/*.txt
          results/stats_latest.json
        retention-days: 7

    - name: Commit Results
      run: |
        git config user.name "AI Proxy Bot"
        git config user.email "bot@github.actions"
        for i in 1 2 3; do
          git pull origin main --rebase --autostash && break
          sleep 5
        done
        git add -f results/premium/*.txt || true
        git add -f results/stats_latest.json || true
        git add -f results/history.jsonl || true
        git add -f README.md || true
        if git diff --cached --quiet; then
          echo "No changes"
          exit 0
        fi
        TOTAL="${{ steps.check.outputs.total }}"
        ELITE="${{ steps.check.outputs.elite }}"
        PREMIUM="${{ steps.check.outputs.premium }}"
        git commit -m "Update: ${TOTAL} keys (${ELITE} elite, ${PREMIUM} premium)"
        for i in 1 2 3; do
          git push origin main && break
          git pull --rebase origin main
          sleep 3
        done

