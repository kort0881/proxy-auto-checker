name: Premium Proxy Checker

on:
  schedule:
    - cron: '0 6 * * *'  # Каждый день в 6:00 UTC
  workflow_dispatch:

concurrency:
  group: proxy-checker-push
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  advanced-check:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    
    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: 🐍 Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: 📦 Install
      run: |
        pip install --upgrade pip
        pip install requests[socks]
    
    - name: 📥 Download verified keys
      uses: dawidd6/action-download-artifact@v6
      with:
        workflow: check-proxies.yml
        name: verified-keys
        path: results/
        search_artifacts: true
        if_no_artifact_found: warn
      continue-on-error: true
    
    - name: 🔍 Check downloaded files
      run: |
        echo "📂 Содержимое results/:"
        ls -lah results/ || mkdir -p results
        
        if ls results/verified_*.txt 1> /dev/null 2>&1; then
          echo "✅ Найдены verified файлы!"
          key_count=$(cat results/verified_*.txt | grep -v "^#" | grep -v "^$" | wc -l)
          echo "📊 Ключей: ${key_count}"
        else
          echo "⚠️ Не найден verified файл, создаём пустой"
          mkdir -p results
          touch results/verified_empty.txt
        fi
    
    - name: 🔥 Run advanced check
      run: python advanced_checker.py
      continue-on-error: true
    
    - name: 📁 Upload premium artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: premium-keys
        path: results/premium/*.txt
        retention-days: 30
    
    - name: 💾 Commit premium results to repository
      if: success()
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        
        # Подтягиваем последние изменения
        git pull origin main --rebase --autostash || git pull origin main || echo "Nothing to pull"
        
        # ✅ ИСПРАВЛЕНО: добавлен флаг -f для игнорирования .gitignore
        git add -f results/premium/
        
        total_keys=$(find results/premium -name "*.txt" -exec grep -v "^#" {} \; | grep -v "^$" | wc -l 2>/dev/null || echo "0")
        
        git diff --cached --quiet || git commit -m "✨ Update premium keys: ${total_keys} total [$(date -u +'%Y-%m-%d %H:%M UTC')]"
        
        git push origin main
        
        echo "✅ Premium results saved to results/premium/"
        echo "📊 Files:"
        ls -lh results/premium/ || echo "No files yet"



