name: Premium Proxy Checker

on:
  schedule:
    - cron: '0 6 * * *'  # Каждый день в 6:00 UTC
  workflow_dispatch:

concurrency:
  group: proxy-checker-push
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  advanced-check:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    
    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: 🐍 Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: 📦 Install
      run: |
        pip install --upgrade pip
        pip install requests[socks]
    
    # ✅ ИСПРАВЛЕНО: Копируем из репозитория вместо скачивания артефакта
    - name: 📥 Copy verified keys from repository
      run: |
        echo "📂 Копируем verified.txt из репозитория"
        mkdir -p results
        
        if [ -f "checked/latest/verified.txt" ]; then
          # Копируем с timestamp
          TIMESTAMP=$(date -u +'%Y-%m-%d_%H-%M-%S')
          cp checked/latest/verified.txt results/verified_${TIMESTAMP}.txt
          
          key_count=$(grep -v "^#" results/verified_${TIMESTAMP}.txt | grep -v "^$" | wc -l)
          echo "✅ Скопировано: ${key_count} ключей из checked/latest/verified.txt"
          echo "📁 Сохранено как: results/verified_${TIMESTAMP}.txt"
          
          echo ""
          echo "📊 Содержимое results/:"
          ls -lh results/
        else
          echo "❌ ОШИБКА: Файл checked/latest/verified.txt не найден!"
          echo "Auto Proxy Checker должен запуститься первым"
          exit 1
        fi
    
    - name: 🔥 Run advanced check
      run: python advanced_checker.py
      continue-on-error: true
    
    - name: 📁 Upload premium artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: premium-keys
        path: results/premium/*.txt
        retention-days: 30
    
    - name: 💾 Commit premium results to repository
      if: success()
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        
        # Подтягиваем последние изменения
        git pull origin main --rebase --autostash || git pull origin main || echo "Nothing to pull"
        
        # ✅ ИСПРАВЛЕНО: добавлен флаг -f для игнорирования .gitignore
        git add -f results/premium/
        
        total_keys=$(find results/premium -name "*.txt" -exec grep -v "^#" {} \; | grep -v "^$" | wc -l 2>/dev/null || echo "0")
        
        git diff --cached --quiet || git commit -m "✨ Update premium keys: ${total_keys} total [$(date -u +'%Y-%m-%d %H:%M UTC')]"
        
        git push origin main
        
        echo "✅ Premium results saved to results/premium/"
        echo "📊 Files:"
        ls -lh results/premium/ || echo "No files yet"



