name: Premium Proxy Checker

on:
  schedule:
    - cron: '0 6 * * *'  # Каждый день в 6:00 UTC
  workflow_dispatch:

jobs:
  advanced-check:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    
    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v3
    
    - name: 🐍 Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: 📦 Install
      run: |
        pip install --upgrade pip
        pip install requests[socks]
    
    - name: 📥 Download verified keys
      uses: dawidd6/action-download-artifact@v2
      with:
        workflow: check-proxies.yml
        name: verified-keys
        path: results/
      continue-on-error: true
    
    - name: 🔥 Run advanced check
      run: python advanced_checker.py
    
    # ========== ИСПРАВЛЕНО: Новая структура ==========
    - name: 📁 Upload premium artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: premium-keys
        path: results/premium/*.txt  # ← ИЗМЕНЕНО: теперь папка premium
        retention-days: 30
    
    - name: 💾 Commit premium results to repository
      if: success()
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        
        # Добавляем всю папку results/premium
        git add results/premium/
        
        # Считаем ключи из всех файлов
        total_keys=$(find results/premium -name "*.txt" -exec grep -v "^#" {} \; | grep -v "^$" | wc -l)
        
        # Коммитим
        git commit -m "✨ Update premium keys: ${total_keys} total [$(date +'%Y-%m-%d %H:%M UTC')]" || echo "No changes"
        git push
        
        echo "✅ Premium results saved to results/premium/"
        echo "📊 Files:"
        ls -lh results/premium/

