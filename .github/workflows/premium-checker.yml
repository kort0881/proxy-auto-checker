name: AI Proxy Checker

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      region:
        description: 'Region'
        required: false
        default: 'ALL'
        type: choice
        options:
          - ALL
          - RU
          - EU

concurrency:
  group: proxy-checker
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        fetch-depth: 1

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        pip install --upgrade pip
        pip install requests[socks] scikit-learn tqdm colorama

    - name: Run Checker
      id: check
      run: |
        REGION="${{ github.event.inputs.region || 'ALL' }}"
        python advanced_checker.py --region "$REGION" --workers 16 --tcp-workers 50

        # Берём статистику из JSON, без арифметики в bash
        TOTAL=$(python -c "import json; d=json.load(open('results/stats_latest.json')); print(d.get('total_working', 0))" 2>/dev/null || echo "0")
        ELITE=$(python -c "import json; d=json.load(open('results/stats_latest.json')); print(d.get('by_quality', {}).get('elite', 0))" 2>/dev/null || echo "0")
        PREMIUM=$(python -c "import json; d=json.load(open('results/stats_latest.json')); print(d.get('by_quality', {}).get('premium', 0))" 2>/dev/null || echo "0")

        echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
        echo "elite=$ELITE" >> "$GITHUB_OUTPUT"
        echo "premium=$PREMIUM" >> "$GITHUB_OUTPUT"

        echo "📊 Found: Total=$TOTAL, Elite=$ELITE, Premium=$PREMIUM"

    - name: Generate README
      if: success()
      env:
        TOTAL: ${{ steps.check.outputs.total }}
        ELITE: ${{ steps.check.outputs.elite }}
        PREMIUM: ${{ steps.check.outputs.premium }}
        REPO: ${{ github.repository }}
      run: |
        DATE=$(date -u +'%Y-%m-%d')
        
        cat > README.md << 'ENDOFFILE'
        # 🔥 AI Proxy Collection
        
        ![гифка.gif](гифка.gif)
        
        ENDOFFILE
        
        cat >> README.md << ENDOFFILE
        ![Total](https://img.shields.io/badge/Total-${TOTAL}-brightgreen)
        ![Elite](https://img.shields.io/badge/Elite-${ELITE}-gold)
        ![Premium](https://img.shields.io/badge/Premium-${PREMIUM}-blue)
        ![Updated](https://img.shields.io/badge/Updated-${DATE}-orange)
        
        ## 📊 Statistics
        
        | Quality | Count | Link |
        |---------|-------|------|
        | **Elite** | ${ELITE} | [elite.txt](results/premium/elite.txt) |
        | **Premium** | ${PREMIUM} | [premium.txt](results/premium/premium.txt) |
        | **Total** | ${TOTAL} | [All Files](results/premium/) |
        
        ## 📥 Quick Download
        
        \`\`\`bash
        # Download Elite proxies
        curl -sL https://raw.githubusercontent.com/${REPO}/main/results/premium/elite.txt
        
        # Download Premium proxies
        curl -sL https://raw.githubusercontent.com/${REPO}/main/results/premium/premium.txt
        \`\`\`
        
        ## 🚀 Usage
        
        1. Click on the links above to view proxy lists
        2. Use \`curl\` command to download directly
        3. Import into your VPN/proxy client
        
        ---
        
        *Auto-generated by AI Proxy Checker Pro • Last updated: ${DATE}*
        ENDOFFILE

    - name: Upload Artifacts
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: keys-${{ github.run_number }}
        path: |
          results/premium/*.txt
          results/stats_latest.json
        retention-days: 7

    - name: Commit Results
      if: success()
      run: |
        git config user.name "AI Proxy Bot"
        git config user.email "bot@github.actions"
        
        # Robust pull/push loop
        for i in 1 2 3 4 5; do
          git pull origin main --rebase --autostash || { sleep 5; continue; }
          break
        done
        
        git add -f results/premium/*.txt || true
        git add -f results/stats_latest.json || true
        git add -f results/history.jsonl || true
        git add -f README.md || true
        
        if git diff --cached --quiet; then
          echo "No changes to commit"
          exit 0
        fi
        
        TOTAL="${{ steps.check.outputs.total }}"
        ELITE="${{ steps.check.outputs.elite }}"
        
        git commit -m "🔥 Update: ${TOTAL} keys (${ELITE} elite) [$(date -u +'%Y-%m-%d')]"
        
        for i in 1 2 3 4 5; do
          git push origin main && break
          git pull --rebase origin main
          sleep $((i * 5))
        done

