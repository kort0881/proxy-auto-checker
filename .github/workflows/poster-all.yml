name: Telegram Poster ALL

on:
  schedule:
    # +2 часа к ai-checker-all (под себя подстроишь при желании)
    - cron: '10 2,8,14,20 * * *'
  workflow_dispatch:

jobs:
  post-all:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run ALL poster
        env:
          TELEGRAM_BOT_TOKEN_PUBLIC: ${{ secrets.TELEGRAM_BOT_TOKEN_PUBLIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_PRIVATE_CHANNEL: ${{ secrets.TELEGRAM_PRIVATE_CHANNEL }}
        run: python post_to_telegram_all.py
